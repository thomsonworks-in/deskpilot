name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: deskpilot.exe
            archive: deskpilot-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: deskpilot
            archive: deskpilot-aarch64-apple-darwin.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            bin: deskpilot
            archive: deskpilot-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: deskpilot
            archive: deskpilot-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          7z a ${{ matrix.archive }} ./target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive }} -C ./target/${{ matrix.target }}/release ${{ matrix.bin }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
