[package]
name = "deskpilot"
version = "0.1.0"
edition = "2021"
description = "A private, ultra-fast, local-first desktop agent and assistant built in Rust"
license = "GPL-3.0-or-later"
repository = "https://github.com/thomsonworks-in/deskpilot"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
single-instance = "0.3"
tray-icon = "0.19"
axum = "0.7"
tokio-stream = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
] }

