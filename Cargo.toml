[package]
name = "deskpilot"
version = "0.1.3"
edition = "2021"
description = "A private, ultra-fast, local-first desktop AI agent — headless daemon with Obsidian Velocity Web Studio"
license = "GPL-3.0-or-later"
repository = "https://github.com/thomsonworks-in/deskpilot"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
single-instance = "0.3"
